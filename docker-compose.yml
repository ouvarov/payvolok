name: payvolok

x-api-image: &api-image
  build: .
  image: payvolok-api

x-local-database: &local-database
  DATABASE_URL: postgres://payvolok:payvolok@db:5432/payvolok

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payvolok
      POSTGRES_PASSWORD: payvolok
      POSTGRES_DB: payvolok
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payvolok -d payvolok']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-image
    command: ['node', 'dist/database/migrate.js']
    environment:
      <<: *local-database
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      <<: *local-database
      NODE_ENV: development
      PORT: 3000
      # sha256 of local-dev-api-key, local development only
      API_KEY_SHA256: 2bcd99491790f5324dd084241b713b576a92b12c497f3b553230d49cc72e15c2
      PUBLIC_BASE_URL: http://localhost:3000
      FAKE_WEBHOOK_SECRET:
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: {}
